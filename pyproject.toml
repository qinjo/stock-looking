[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stocklook"
version = "0.1.0"
description = "A-share next-day direction prediction demo"
requires-python = ">=3.11"
dependencies = [
    "akshare",
    "pandas",
    "numpy",
    "scikit-learn",
    "lightgbm>=4.0",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["stocklook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
